name: tavchain-fullnode
x-node: &node
  image: ${TAVCHAIN_IMAGE:-ghcr.io/safeney/tavchain-fullnode@sha256:0b7ae286253a9555009c846f4e203e06060ba4a9e8b1b8788fa06445343f396d}
  platform: linux/amd64
  pull_policy: if_not_present
  user: "10001:10001"
  environment:
    HOME: /data
    TAVCHAIN_MONIKER: ${TAVCHAIN_MONIKER:-my-tavchain-fullnode}
  read_only: true
  tmpfs: [/tmp]
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  volumes: [node-data:/data]
services:
  init:
    <<: *node
    profiles: [tools]
    entrypoint: [/usr/local/bin/init-node]
    command: []
    restart: "no"
  node:
    <<: *node
    restart: unless-stopped
    stop_grace_period: 5m
    ports:
      - "127.0.0.1:29657:29657"
      - "127.0.0.1:29645:29645"
      - "127.0.0.1:29646:29646"
    command:
      - start
      - --home
      - /data
      - --moniker
      - ${TAVCHAIN_MONIKER:-my-tavchain-fullnode}
      - --genesis_hash
      - a101ab9ccf1478757af8a69d832548ea1167e552fe6d6ef6621a77447a54e924
      - --rpc.laddr
      - tcp://0.0.0.0:29657
      - --p2p.laddr
      - tcp://0.0.0.0:29656
      - --json-rpc.address
      - 0.0.0.0:29645
      - --json-rpc.ws-address
      - 0.0.0.0:29646
volumes:
  node-data:
